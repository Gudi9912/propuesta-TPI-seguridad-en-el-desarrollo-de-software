<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login con bloqueo por niveles</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1a1d23;--mu:#5d6572;--bd:#d9dde3;--ac:#2457d6;--ok:#1a7f45;--er:#c0302b;--wa:#a35f00}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#e8eaee;--mu:#9aa3b0;--bd:#323741;--ac:#6b93ff;--ok:#4cc582;--er:#ff7b72;--wa:#f0b04a}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 4px}p.s{color:var(--mu);margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}
.tabs button[aria-selected="true"]{border-color:var(--ac);color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.lvl{color:var(--mu);font-size:13px;margin:0 0 4px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.btn{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-top:8px}
.msg{margin-top:12px;padding:10px;border-radius:6px;border:1px solid var(--bd);min-height:20px}
.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{border:1px solid var(--bd);padding:6px;text-align:left}
.sc{overflow-x:auto}
.dos{display:flex;gap:8px}
</style>
</head>
<body>
<main>
<h1>Login con bloqueo por niveles</h1>
<p class="s">Usuarios de prueba: admin / Clave123! y ana / Ana2026#</p>

<div class="tabs" id="tabs" role="tablist"></div>
<div class="card">
  <p class="lvl" id="desc"></p>
  <label for="u">Usuario</label><input id="u" autocomplete="username" value="admin">
  <label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password">
  <label for="ip">IP</label><input id="ip" value="192.168.1.10">
  <label for="ua">User agent</label><input id="ua">
  <button class="btn" id="go">Ingresar</button>
  <div class="dos">
    <button class="btn sec" id="otraIp" type="button">Cambiar solo la IP</button>
    <button class="btn sec" id="otroUa" type="button">Cambiar solo el user agent</button>
  </div>
  <button class="btn sec" id="reset" type="button">Resetear tiempo de bloqueo</button>
</div>
</main>
<script>
const NIVELES=[
 {t:"Nivel 1",d:"Sin bloqueo: se puede intentar infinitas veces.",url:"/login/nivel1"},
 {t:"Nivel 2",d:"Bloqueo por usuario.",url:"/login/nivel2"},
 {t:"Nivel 3",d:"Bloqueo por usuario + IP.",url:"/login/nivel3"},
 {t:"Nivel 4",d:"Bloqueo por usuario + IP + user agent.",url:"/login/nivel4"},
 {t:"Nivel 5",d:"Como el nivel 4, y además bloquea la cuenta al acumular 30 fallos en total, vengan de donde vengan (detecta ataques distribuidos).",url:"/login/nivel5"}];
let n=0,timer=null;
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const post=(url,body)=>fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(async r=>({status:r.status,...await r.json()}));

$("ua").value=navigator.userAgent;
function render(){
  $("tabs").innerHTML=NIVELES.map((x,i)=>`<button role="tab" aria-selected="${i===n}" data-i="${i}">${x.t}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{n=+b.dataset.i;clearInterval(timer);setMsg("","");render()});
  $("desc").textContent=NIVELES[n].d;
}
function setMsg(t,c){$("msg").textContent=t;$("msg").className="msg "+c}

async function enviar(){
  clearInterval(timer);
  const body={username:$("u").value.trim(),password:$("p").value,ip:$("ip").value.trim(),userAgent:$("ua").value};
  if(!body.ip)delete body.ip;if(!body.userAgent)delete body.userAgent; // si faltan, el servidor usa los de la conexión
  try{
    const d=await post(NIVELES[n].url,body);
    if(d.ok)setMsg(d.msg,"ok");
    else if(d.status===429){
      let seg=d.restanteSegundos;
      const tick=()=>{if(seg<=0){clearInterval(timer);setMsg("El bloqueo terminó. Ya puedes intentar de nuevo.","ok");return}
        setMsg(d.msg+" Tiempo restante: "+fmt(seg),"wa");seg--};
      tick();timer=setInterval(tick,1000);
    }else setMsg(d.msg,"er");
  }catch(e){setMsg("No se pudo conectar con el servidor.","er")}
  $("p").value="";
}

const r=()=>Math.floor(Math.random()*254)+1;
function otraIp(){
  $("ip").value=`${r()}.${r()}.${r()}.${r()}`;
  setMsg("IP cambiada. El user agent sigue igual.","wa");
}
function otroUa(){
  const uas=["Firefox/121 (Linux)","Safari/17 (iPhone)","Chrome/120 (Android)","Edge/120 (Windows 10)"];
  $("ua").value=uas[Math.floor(Math.random()*uas.length)]+" #"+r();
  setMsg("User agent cambiado. La IP sigue igual.","wa");
}

async function resetBloqueo(){
  clearInterval(timer);
  try{
    await post("/demo/reset",{});
    setMsg("Se reiniciaron todos los bloqueos y contadores del servidor.","ok");
  }catch(e){setMsg("No se pudo conectar con el servidor.","er")}
}

$("go").onclick=enviar;$("p").onkeydown=e=>{if(e.key==="Enter")enviar()};
$("otraIp").onclick=otraIp;$("otroUa").onclick=otroUa;$("reset").onclick=resetBloqueo;
render();
</script>
</body>
</html>
